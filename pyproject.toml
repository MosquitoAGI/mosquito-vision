[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly-vision"
version = "0.2.0"
description = "Sensory front end: camera frames in, small fixed-width sensory packets out"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
plot = ["matplotlib>=3.7", "Pillow>=10"]

[project.scripts]
fruitfly-vision = "fruitfly_vision.cli:main"

[project.urls]
Homepage = "https://github.com/fruitflyxyz/fruitfly-vision"
Repository = "https://github.com/fruitflyxyz/fruitfly-vision"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
