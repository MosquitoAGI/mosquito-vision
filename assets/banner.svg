<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="FruitFlyVision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101a2c"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#37d399"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="60" y="96" fill="#e8eefc" font-size="52" font-weight="bold">FruitFlyVision</text>
    <text x="60" y="140" fill="#8fa3c8" font-size="24">frames in, six sensory numbers out</text>
    <text x="60" y="182" fill="#5f7099" font-size="17">left_motion · right_motion · coverage · coverage_growth · centroid_x · centroid_y</text>
  </g>
  <g stroke="#2f4a6b" stroke-width="1.5" fill="none">
    <rect x="60" y="212" width="150" height="52" rx="8" fill="#141f36"/>
    <rect x="270" y="212" width="150" height="52" rx="8" fill="#141f36"/>
    <rect x="480" y="212" width="190" height="52" rx="8" fill="#141f36"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c8d6f0">
    <text x="88" y="244">camera</text>
    <text x="292" y="244">encoder</text>
    <text x="500" y="244">session.jsonl</text>
  </g>
  <g stroke="#37d399" stroke-width="2" marker-end="url(#a)">
    <line x1="214" y1="238" x2="264" y2="238"/>
    <line x1="424" y1="238" x2="474" y2="238"/>
    <line x1="674" y1="238" x2="760" y2="238"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8fa3c8">
    <text x="770" y="232">calibrate</text>
    <text x="770" y="254">→ calibration.json</text>
    <text x="770" y="276">→ the bridge</text>
  </g>
